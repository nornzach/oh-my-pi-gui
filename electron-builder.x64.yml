appId: sh.omp.gui
productName: omp
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp.x64
    to: omp
# Must match electron-builder.yml: the x64 bundle is a separate config, so the
# `omp://` scheme has to be declared here too or Intel Macs get no deep links.
protocols:
  - name: omp
    schemes:
      - omp
asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Seal the complete bundle even when no Developer ID certificate is available.
  # This preserves macOS's user-override flow instead of presenting the app as damaged.
  identity: "-"
  target:
    - target: dmg
      arch: [x64]
    - target: zip
      arch: [x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: omp uses the microphone for voice dictation in the composer.
    # Electron's stock bundle asks for camera and Bluetooth with text that names no
    # app; omp never calls either API, so the prompt a user might see stays honest.
    NSCameraUsageDescription: omp does not use the camera.
    NSBluetoothAlwaysUsageDescription: omp does not use Bluetooth.
    NSBluetoothPeripheralUsageDescription: omp does not use Bluetooth.
    # Two origins only: the loopback stats server and GitHub releases over TLS.
    # Declaring that is stricter than the default, so an accidental remote
    # cleartext request cannot start working because some build set
    # NSAllowsArbitraryLoads.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  notarize: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: nornzach
  repo: oh-my-pi-gui

electronLanguages:
  - en
