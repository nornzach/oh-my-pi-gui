name: Release Linux builds

# Builds the Linux artifacts (AppImage + deb + rpm + latest-linux.yml) on Ubuntu and
# attaches them to the release. The bundled sidecar must come from the monorepo
# fork — upstream lacks the GUI-only flags — so this checks out BOTH repos:
# the GUI at the selected ref and the monorepo repository and commit recorded
# in that GUI revision's sidecar-source.json.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.9.14)"
        required: true
      gui_ref:
        description: "GUI checkout ref (default: the tag; use main to backfill an old tag)"
        required: false
      monorepo_sha:
        description: "Monorepo commit override (default: sidecar-source.json pin)"
        required: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/release-source
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          gui_ref: ${{ github.event_name == 'release' && github.sha || inputs.gui_ref || format('refs/tags/{0}', inputs.tag) }}
          tag: ${{ env.RELEASE_TAG }}
          monorepo_sha: ${{ inputs.monorepo_sha }}
          core_repo: ${{ vars.OMP_CORE_REPO || 'nornzach/oh-my-pi' }}

      - name: Build native addons from the pinned Core source
        working-directory: oh-my-pi
        shell: bash
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: |
          PI_NATIVE_VARIANT=modern bun --cwd=packages/natives run build
          PI_NATIVE_VARIANT=baseline bun --cwd=packages/natives run build

      - name: Build the bundled Linux sidecar
        working-directory: oh-my-pi
        run: bun --cwd=packages/gui run build:omp

      - name: Smoke-test the sidecar (RPC handshake + settings round-trip)
        working-directory: oh-my-pi/packages/gui
        run: bun scripts/smoke-sidecar.mjs resources/omp

      - name: Build GUI + Linux packages
        working-directory: oh-my-pi/packages/gui
        # NOTE: invoke electron-builder through bun — the bunx shim falls back
        # to Node, which crashes on ESM deps under Node < 22 (see issue #10).
        # The monorepo's bun install hoists deps to the workspace root, so the
        # cli.js lives two levels up, not in packages/gui/node_modules.
        run: |
          bun run build
          bun ../../node_modules/electron-builder/cli.js \
            --config electron-builder.yml --linux AppImage deb rpm --publish never \
            -c.publish.owner="${GITHUB_REPOSITORY%/*}" -c.publish.repo="${GITHUB_REPOSITORY#*/}"

      - name: Upload Linux assets to the release
        working-directory: oh-my-pi/packages/gui/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(omp-*.AppImage omp-*.AppImage.blockmap omp-*.deb omp_*.deb omp-*.rpm omp_*.rpm latest-linux.yml)
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
